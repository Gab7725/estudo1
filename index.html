<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fiscaliza CTB</title>
<style>
:root{
  --bg:#0b1220;--card:#152033;--line:#243247;--txt:#eef3fb;--mut:#93a4bd;
  --ok:#22c55e;--err:#ef4444;--acc:#22d3ee;--warn:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding:12px 12px 110px}
header{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.96);backdrop-filter:blur(8px);
  padding:12px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
header h1{font-size:1.15rem;color:var(--acc);letter-spacing:.2px}
header p{font-size:.76rem;color:var(--mut);margin-top:2px}
.bar{height:6px;background:#0b1220;border-radius:999px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#06b6d4,#22d3ee);transition:width .3s}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mut);padding:8px 12px;
  border-radius:999px;font-size:.78rem;font-weight:600;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--acc);color:var(--txt)}
.chip.on{background:var(--acc);color:#06202a;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:.95rem;margin-bottom:8px;color:var(--acc)}
.meta{font-size:.72rem;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sit{background:#0f1a2b;border-left:4px solid var(--acc);border-radius:10px;padding:12px;font-size:.92rem}
label{display:block;font-size:.7rem;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;
  margin:14px 0 6px;font-weight:700}
label:first-of-type{margin-top:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.wide{grid-template-columns:1fr}
.opt{border:1px solid var(--line);background:#0b1220;border-radius:10px;padding:12px 10px;
  font-size:.85rem;cursor:pointer;text-align:left;color:var(--txt);font-family:inherit;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.on{border-color:var(--acc);background:#0b2a33;color:var(--acc);font-weight:700}
.opt.right{border-color:var(--ok);background:#0d2418;color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--err);background:#2a1114;color:var(--err);font-weight:700}
.opt.dim{opacity:.42}
.opt:disabled{cursor:default}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:1rem;font-weight:800;
  cursor:pointer;font-family:inherit;transition:.15s}
.btn:active{transform:scale(.985)}
.btn-main{background:linear-gradient(135deg,#06b6d4,#0ea5e9);color:#041018}
.btn-main:disabled{opacity:.35;cursor:not-allowed}
.btn-sec{background:#1b2a40;color:var(--txt);border:1px solid var(--line)}
.btn-mini{padding:6px 10px;font-size:.72rem;border-radius:8px;width:auto}
.foot{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#101a2b;
  border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;z-index:30}
.foot .btn{margin:0}
.gab{margin-top:14px;border-radius:12px;padding:14px;border:1px solid #1f3a2a;background:#0d1f17;animation:pop .2s ease}
.gab.bad{background:#211014;border-color:#3a1a1f}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gab h3{margin-bottom:10px;font-size:.95rem}
.gab table{width:100%;font-size:.85rem;border-collapse:collapse}
.gab td{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
.gab td:first-child{color:var(--mut);width:42%;padding-right:8px}
.gab tr:last-child td{border-bottom:0}
.fund{margin-top:12px;font-size:.85rem;color:#b7c7db;background:rgba(0,0,0,.25);
  padding:10px;border-radius:8px;border-left:3px solid var(--acc)}
.score{width:74px;height:74px;border-radius:50%;border:5px solid var(--line);display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;margin:0 auto 10px}
.score.ok{border-color:var(--ok);color:var(--ok)}
.score.mid{border-color:var(--warn);color:var(--warn)}
.score.bad{border-color:var(--err);color:var(--err)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#0f2233;
  border:1px solid var(--acc);color:var(--txt);padding:10px 16px;border-radius:10px;z-index:50;
  font-size:.85rem;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:pop .2s ease}
.empty{text-align:center;color:var(--mut);padding:40px 12px;font-size:.9rem}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Fiscaliza CTB</h1>
    <p>Treino Agente de Trânsito · DETRAN-SP · <span id="qtd">0</span> questões</p>
    <div class="bar"><i id="barra"></i></div>
  </header>
  <div id="app"></div>
</div>

<div class="foot">
  <button class="btn btn-sec" data-act="prev">◀ Anterior</button>
  <button class="btn btn-main" data-act="next">Próxima ▶</button>
</div>

<script>
/* ============================================================
   1. BANCO DE QUESTÕES
   ============================================================ */
const Q = [];

function add(o){ o.id = 'q' + (Q.length + 1); Q.push(o); }

/* ---- Infração (quiz de 5 campos) ---- */
function inf(tema, situacao, irregularidade, enquadramento, gravidade, pontos,
             penalidade, medida, flags, fundamento){
  add({
    tipo:'infracao', tema, situacao, irregularidade, enquadramento,
    gravidade, pontos, penalidade, medida,
    retencao: !!flags[0], remocao: !!flags[1], recolhe_doc: !!flags[2],
    fundamento
  });
}

/* ---- Teoria (múltipla escolha simples) ---- */
function teo(tema, situacao, alternativas, correta, fundamento){
  add({ tipo:'teoria', tema, situacao, alternativas, correta, fundamento });
}

/* ---------- VELOCIDADE — Art. 218 ---------- */
const LIMITES = [
  [30,[34,40,50]],  [40,[46,52,62]],  [50,[57,65,78]],
  [60,[69,78,93]],  [70,[80,91,109]], [80,[92,104,124]],
  [90,[103,117,140]],[100,[115,130,155]],[110,[126,143,170]]
];

LIMITES.forEach(function(par){
  const lim = par[0];
  par[1].forEach(function(v){
    const pct = (v - lim) / lim * 100;
    let art, g, p, pen;
    if (pct <= 20)      { art='I';   g='media';      p=4; pen='Multa'; }
    else if (pct <= 50) { art='II';  g='grave';      p=5; pen='Multa'; }
    else                { art='III'; g='gravissima'; p=7; pen='Multa (3x) e suspensão do direito de dirigir'; }

    add({
      tipo:'infracao', tema:'Velocidade',
      situacao:'Radar registrou ' + v + ' km/h em via cujo limite é ' + lim + ' km/h.',
      irregularidade:'Excesso de velocidade',
      enquadramento:'Art. 218, ' + art + ', CTB',
      gravidade:g, pontos:p, penalidade:pen,
      medida: art === 'III' ? 'Suspensão do direito de dirigir (processo)' : 'Nenhuma',
      retencao:false, remocao:false, recolhe_doc:false,
      fundamento:'Art. 218 do CTB: até 20% → inciso I (média); mais de 20% até 50% → inciso II (grave); ' +
        'acima de 50% → inciso III (gravíssima, multa 3x + suspensão). ' +
        'Excesso de ' + pct.toFixed(1) + '% (limite ' + lim + ' km/h).'
    });
  });
});

/* ---------- MOTOCICLETAS ---------- */
const TM = 'Motocicletas';
inf(TM,'Condutor de motocicleta circulando sem capacete.','Sem capacete','Art. 244, I, CTB',
  'gravissima',7,'Multa e suspensão do direito de dirigir','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'Art. 244, I. Infração gravíssima, com suspensão e recolhimento do documento de habilitação.');
inf(TM,'Passageiro de motocicleta sem capacete de segurança.','Passageiro sem capacete','Art. 244, I, CTB',
  'gravissima',7,'Multa e suspensão do direito de dirigir','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'O Art. 244, I alcança também o passageiro transportado sem capacete.');
inf(TM,'Motocicleta com descarga livre (escapamento alterado).','Descarga livre','Art. 230, XI, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 230, XI. A retenção ocorre até a regularização — não há remoção automática ao pátio.');
inf(TM,'Motocicleta transportando criança de 7 anos.','Criança na moto','Art. 244, V, CTB',
  'gravissima',7,'Multa e suspensão do direito de dirigir','Retenção do veículo',
  [1,0,0],'Art. 244, V: transportar criança menor de 10 anos em motocicleta.');
inf(TM,'Condutor com capacete sem viseira nem óculos de proteção.','Capacete irregular','Art. 244, I, CTB',
  'gravissima',7,'Multa e suspensão do direito de dirigir','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'Art. 244, I combinado com as resoluções do CONTRAN sobre equipamentos de segurança.');
inf(TM,'Motocicleta transitando de dia com o farol apagado.','Farol apagado','Art. 244 / Art. 40, CTB',
  'media',4,'Multa','Nenhuma',
  [0,0,0],'Uso obrigatório do farol baixo aceso durante o dia para motocicletas.');
inf(TM,'Passageiro transportado fora do assento traseiro.','Passageiro irregular','Art. 244, II, CTB',
  'gravissima',7,'Multa e suspensão do direito de dirigir','Retenção do veículo',
  [1,0,0],'Art. 244, II: transportar passageiro em desacordo com as normas.');
inf(TM,'Placa da motocicleta ilegível.','Placa ilegível','Art. 230, I, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 230, I: conduzir veículo com identificação externa em desacordo com as normas.');
inf(TM,'Motocicleta com pneu traseiro careca.','Pneu careca','Art. 230, XVIII, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 230, XVIII: conduzir veículo em mau estado de conservação, comprometendo a segurança.');
inf(TM,'Motocicleta sem espelho retrovisor.','Sem espelho','Art. 230, IX, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 230, IX: conduzir veículo com equipamento obrigatório em desacordo ou ineficiente.');

/* ---------- VEÍCULOS ---------- */
const TV = 'Veículos';
inf(TV,'Condutor de automóvel sem cinto de segurança.','Sem cinto','Art. 167, CTB',
  'grave',5,'Multa','Retenção do veículo até a colocação do cinto',
  [1,0,0],'Art. 167. A retenção cessa assim que o cinto é colocado — a multa permanece.');
inf(TV,'Passageiro do banco dianteiro sem cinto de segurança.','Passageiro sem cinto','Art. 167, CTB',
  'grave',5,'Multa','Retenção do veículo até a colocação do cinto',
  [1,0,0],'Art. 167 aplica-se ao condutor e aos passageiros.');
inf(TV,'Criança de 5 anos no banco dianteiro sem cadeirinha nem bebê-conforto.','Criança sem dispositivo','Art. 168 + Res. 819/2021',
  'gravissima',7,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 168 do CTB + Resolução CONTRAN 819/2021 (transporte de crianças).');
inf(TV,'Criança de 8 anos, 1,30 m, no banco dianteiro apenas com o cinto de 3 pontos.','Altura inferior a 1,45 m','Art. 168 + Res. 819/2021',
  'gravissima',7,'Multa','Retenção do veículo até regularização',
  [1,0,0],'A regra combina idade E altura: menores de 10 anos que não atingiram 1,45 m exigem dispositivo de retenção.');
inf(TV,'Farol dianteiro esquerdo queimado.','Equipamento inoperante','Art. 230, IX, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 230, IX. Regularizado no local, o veículo é liberado — a multa permanece.');
inf(TV,'Película muito escura nos vidros laterais dianteiros.','Película irregular','Art. 230 + Res. CONTRAN',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Transmissão luminosa fora dos limites estabelecidos pelo CONTRAN.');
inf(TV,'Veículo estacionado sobre a calçada.','Estacionado na calçada','Art. 181, VIII, CTB',
  'media',4,'Multa','Remoção do veículo ao pátio',
  [0,1,0],'Art. 181, VIII — estacionar sobre a calçada gera multa E remoção.');
inf(TV,'Veículo estacionado em local com placa de proibição.','Local proibido','Art. 181, XVII, CTB',
  'media',4,'Multa','Remoção do veículo ao pátio',
  [0,1,0],'Art. 181, XVII — estacionar em desacordo com a sinalização gera multa E remoção.');
inf(TV,'Veículo em vaga de PCD sem credencial.','Vaga PCD sem credencial','Art. 181, XX, CTB',
  'gravissima',7,'Multa','Remoção do veículo ao pátio',
  [0,1,0],'Art. 181, XX — vaga reservada a pessoa com deficiência sem credencial.');
inf(TV,'Veículo em vaga de idoso sem credencial.','Vaga de idoso sem credencial','Art. 181, XX, CTB',
  'gravissima',7,'Multa','Remoção do veículo ao pátio',
  [0,1,0],'Art. 181, XX — vaga reservada a idoso sem credencial.');
inf(TV,'Para-brisa com trinca que compromete a visão do condutor.','Mau estado de conservação','Art. 230, XVIII, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 230, XVIII — mau estado de conservação comprometendo a segurança.');
inf(TV,'Pneus lisos (carecas) nos dois eixos.','Pneus carecas','Art. 230, XVIII, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 230, XVIII.');
inf(TV,'Veículo com chassi adulterado.','Chassi adulterado','Art. 230, V, CTB',
  'gravissima',7,'Multa e apreensão do veículo','Remoção do veículo e retenção dos documentos',
  [0,1,1],'Art. 230, V — identificação adulterada. Pode configurar crime (CP, art. 311).');
inf(TV,'Placa com caracteres adulterados.','Placa adulterada','Art. 230, I e V, CTB',
  'gravissima',7,'Multa e apreensão do veículo','Remoção do veículo e retenção dos documentos',
  [0,1,1],'Art. 230 — adulteração de identificação veicular.');
inf(TV,'Caminhão com excesso de peso sobre o eixo traseiro.','Excesso de peso','Art. 231, V, CTB',
  'media',4,'Multa','Retenção do veículo e transbordo da carga',
  [1,0,0],'Art. 231, V combinado com o Art. 269, VIII (transbordo da carga).');
inf(TV,'Dois veículos disputando corrida em avenida movimentada.','Racha','Art. 173, CTB',
  'gravissima',7,'Multa (10x), suspensão do direito de dirigir e apreensão do veículo','Remoção do veículo e recolhimento da CNH',
  [0,1,1],'Art. 173 — multa multiplicada por 10. Também configura crime de trânsito (art. 308).');
inf(TV,'Competição automobilística em via pública sem autorização.','Competição não autorizada','Art. 174, CTB',
  'gravissima',7,'Multa (10x) e suspensão do direito de dirigir','Remoção do veículo',
  [0,1,1],'Art. 174 — promoção de competição não autorizada em via pública.');
inf(TV,'Condutor usando telefone celular na mão enquanto dirige.','Celular ao volante','Art. 252, VI, CTB',
  'media',4,'Multa','Nenhuma',
  [0,0,0],'Art. 252, VI — dirigir segurando ou manuseando telefone celular.');
inf(TV,'Som automotivo em volume excessivo incomodando a vizinhança.','Som excessivo','Art. 228, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 228 — perturbação do sossego com som acima dos limites.');
inf(TV,'Carga solta na carroceria, sem amarração.','Carga mal acondicionada','Art. 235, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 235 — carga mal acondicionada ou sem amarração.');

/* ---------- HABILITAÇÃO ---------- */
const TH = 'Habilitação';
inf(TH,'Condutor sem CNH e sem PPD dirigindo automóvel.','Sem habilitação','Art. 162, I, CTB',
  'gravissima',7,'Multa (3x) e apreensão do veículo','Retenção do veículo até apresentação de condutor habilitado',
  [1,0,0],'Art. 162, I — multa multiplicada por 3.');
inf(TH,'Condutor com CNH categoria B dirigindo ônibus (categoria D).','Categoria diversa','Art. 162, III, CTB',
  'gravissima',7,'Multa e apreensão do veículo','Retenção do veículo até apresentação de condutor habilitado',
  [1,0,0],'Art. 162, III — dirigir com CNH de categoria diferente da exigida.');
inf(TH,'Condutor com CNH cassada dirigindo.','CNH cassada','Art. 162, II, CTB',
  'gravissima',7,'Multa (3x) e apreensão do veículo','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'Art. 162, II — dirigir com CNH cassada.');
inf(TH,'Condutor com CNH suspensa dirigindo.','CNH suspensa','Art. 162, II + Art. 263, I, CTB',
  'gravissima',7,'Multa (3x) e apreensão do veículo','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'Art. 162, II + Art. 263, I — dirigir durante a suspensão gera processo de cassação.');
inf(TH,'Bafômetro registra 0,15 mg/L de álcool no ar alveolar.','Sob influência de álcool','Art. 165, CTB',
  'gravissima',7,'Multa (10x) e suspensão do direito de dirigir por 12 meses','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'Art. 165 — tolerância zero para álcool. Multa multiplicada por 10.');
inf(TH,'Bafômetro registra 0,28 mg/L, sem sinais aparentes de embriaguez.','Infração administrativa','Art. 165, CTB',
  'gravissima',7,'Multa (10x) e suspensão do direito de dirigir por 12 meses','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'Crime de trânsito (art. 306) só a partir de 0,3 mg/L ou com sinais de alteração da capacidade psicomotora.');
inf(TH,'Bafômetro registra 0,35 mg/L.','Álcool + crime de trânsito','Art. 165 + Art. 306, CTB',
  'gravissima',7,'Multa (10x) e suspensão por 12 meses, além da responsabilidade penal','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'Art. 165 (administrativo) + Art. 306 do CTB (crime).');
inf(TH,'Condutor se recusa a soprar o bafômetro.','Recusa ao teste','Art. 165-A, CTB',
  'gravissima',7,'Multa (10x) e suspensão do direito de dirigir por 12 meses','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'Art. 165-A — a recusa tem a mesma penalidade do Art. 165.');
inf(TH,'Condutor com CNH vencida há 3 meses.','CNH vencida','Art. 162, V, CTB',
  'gravissima',7,'Multa','Retenção do veículo até apresentação de condutor habilitado',
  [1,0,0],'Art. 162, V — dirigir com CNH vencida há mais de 30 dias.');
inf(TH,'Permissão para Dirigir (PPD) com infração gravíssima cometida.','Infração na permissão','Art. 148 e normas do CONTRAN',
  'gravissima',7,'Multa da infração + não conversão da PPD em CNH definitiva','Conforme a infração',
  [0,0,0],'A infração gravíssima na permissão impede a conversão automática em CNH definitiva.');
inf(TH,'Condutor com CNH categoria A dirigindo automóvel (categoria B).','Categoria diversa','Art. 162, III, CTB',
  'gravissima',7,'Multa e apreensão do veículo','Retenção do veículo até apresentação de condutor habilitado',
  [1,0,0],'Art. 162, III — categoria A não habilita a conduzir automóvel.');
inf(TH,'Condutor com CNH categoria B dirigindo motocicleta.','Categoria diversa','Art. 162, III, CTB',
  'gravissima',7,'Multa e apreensão do veículo','Retenção do veículo até apresentação de condutor habilitado',
  [1,0,0],'Art. 162, III — é necessária a categoria A para motocicletas.');
inf(TH,'Condutor se recusa ao teste do bafômetro e não apresenta sinais de embriaguez.','Recusa ao teste','Art. 165-A, CTB',
  'gravissima',7,'Multa (10x) e suspensão do direito de dirigir por 12 meses','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'Art. 165-A — a recusa é infração autônoma, independente de sinais.');
inf(TH,'Motorista com CNH vencida há 5 anos.','CNH vencida','Art. 162, V, CTB',
  'gravissima',7,'Multa','Retenção do veículo até apresentação de condutor habilitado',
  [1,0,0],'Art. 162, V — o vencimento há mais de 30 dias configura a infração.');
inf(TH,'Condutor com CNH definitiva dirigindo durante suspensão por pontos.','CNH suspensa','Art. 162, II + Art. 263, I, CTB',
  'gravissima',7,'Multa (3x) e apreensão do veículo','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'Art. 162, II + Art. 263, I — dirige suspenso, abre-se processo de cassação.');

/* ---------- SINALIZAÇÃO ---------- */
const TS = 'Sinalização';
inf(TS,'Veículo avançou o sinal vermelho do semáforo.','Avanço de sinal','Art. 208, CTB',
  'gravissima',7,'Multa','Nenhuma',[0,0,0],'Art. 208 — avançar o sinal vermelho. Não há medida administrativa automática.');
inf(TS,'Veículo não parou na placa PARE.','Parada obrigatória','Art. 208, CTB',
  'gravissima',7,'Multa','Nenhuma',[0,0,0],'Art. 208 — desrespeitar a parada obrigatória.');
inf(TS,'Condutor não deu preferência ao pedestre que atravessava na faixa.','Preferência do pedestre','Art. 214, I, CTB',
  'gravissima',7,'Multa','Nenhuma',[0,0,0],'Art. 214, I — deixar de dar preferência ao pedestre na faixa.');

/* ============================================================
   2. ESTADO
   ============================================================ */
const TEMAS = ['Todos','Velocidade','Motocicletas','Veículos','Habilitação','Sinalização','Medidas'];
const GRAV_LABEL = {leve:'Leve', media:'Média', grave:'Grave', gravissima:'Gravíssima'};

const STORE_KEY = 'fc_stats_v2';
const state = {
  tema:'Todos',
  lista:[],
  i:0,
  q:null,
  answered:false,
  sel:{},
  last:null,
  stats: JSON.parse(localStorage.getItem(STORE_KEY) || '{"ok":0,"bad":0}')
};

function saveStats(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state.stats)); } catch(e){}
}

/* ============================================================
   3. HELPERS
   ============================================================ */
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function h(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 1900);
}

/* Pool de artigos para os distratores */
const ART_POOL = Array.from(new Set(
  Q.filter(function(q){ return q.tipo === 'infracao'; }).map(function(q){ return q.enquadramento; })
));

function artOptions(q){
  const doTema = Array.from(new Set(
    Q.filter(function(x){ return x.tipo === 'infracao' && x.tema === q.tema; })
     .map(function(x){ return x.enquadramento; })
  )).filter(function(a){ return a !== q.enquadramento; });

  const outros = ART_POOL.filter(function(a){
    return a !== q.enquadramento && doTema.indexOf(a) === -1;
  });

  const escolhidos = shuffle(doTema.slice()).slice(0, 3);
  const faltam = 5 - escolhidos.length;
  const resto = shuffle(outros.slice()).slice(0, faltam);

  return shuffle([q.enquadramento].concat(escolhidos, resto));
}

/* ============================================================
   4. FLUXO
   ============================================================ */
function filt(){
  state.lista = state.tema === 'Todos'
    ? shuffle(Q.slice())
    : shuffle(Q.filter(function(x){ return x.tema === state.tema; }));
  load(0);
}

function load(i){
  if (!state.lista.length) return;
  state.i = i;
  state.q = state.lista[i];
  state.answered = false;
  state.sel = {};
  state.last = null;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function setTema(t){
  if (state.tema === t) return;
  state.tema = t;
  filt();
}

function choose(campo, valor){
  if (state.answered) return;
  state.sel[campo] = valor;
  render();
}

function check(){
  const q = state.q;

  if (q.tipo === 'infracao'){
    const obrig = ['gravidade','pontos','retencao','remocao','art'];
    const falta = obrig.filter(function(k){ return state.sel[k] === undefined; });
    if (falta.length){ toast('Responda todos os campos antes de ver o gabarito.'); return; }

    const r = {
      gravidade: state.sel.gravidade === q.gravidade,
      pontos:    Number(state.sel.pontos) === q.pontos,
      retencao:  (state.sel.retencao === 'sim') === q.retencao,
      remocao:   (state.sel.remocao === 'sim') === q.remocao,
      art:       state.sel.art === q.enquadramento
    };
    const acertos = Object.keys(r).filter(function(k){ return r[k]; }).length;
    state.last = { r:r, acertos:acertos, total:5, score:Math.round(acertos / 5 * 100) };
  } else {
    if (state.sel.alt === undefined){ toast('Escolha uma alternativa.'); return; }
    const ok = Number(state.sel.alt) === q.correta;
    state.last = { r:{ alt:ok }, acertos: ok ? 1 : 0, total:1, score: ok ? 100 : 0 };
  }

  state.answered = true;
  if (state.last.score >= 60) state.stats.ok++; else state.stats.bad++;
  saveStats();
  render();
}

function nextQ(){
  if (!state.lista.length) return;
  if (state.i + 1 >= state.lista.length){
    state.lista = shuffle(state.lista);
    load(0);
    toast('Fim da lista — recomeçando embaralhado!');
    return;
  }
  load(state.i + 1);
}

function prevQ(){
  if (!state.lista.length) return;
  load(state.i <= 0 ? state.lista.length - 1 : state.i - 1);
}

const ACTIONS = {
  prev: prevQ,
  next: nextQ,
  check: check,
  reset: function(){
    state.stats = {ok:0, bad:0};
    saveStats();
    render();
    toast('Placar zerado.');
  }
};

/* ============================================================
   5. RENDER
   ============================================================ */
function grupo(titulo, campo, opcoes, correto, wide){
  const cls = wide ? 'opts wide' : 'opts';
  const botoes = opcoes.map(function(o){
    const valor = String(o[0]);
    const label = o[1];
    const selecionado = state.sel[campo] === valor;
    let c = 'opt';

    if (state.answered){
      if (valor === String(correto)) c += ' right';
      else if (selecionado)          c += ' wrong';
      else                           c += ' dim';
    } else if (selecionado){
      c += ' on';
    }

    return '<button class="' + c + '" data-g="' + h(campo) + '" data-v="' + h(valor) + '"' +
           (state.answered ? ' disabled' : '') + '>' + h(label) + '</button>';
  }).join('');

  return '<label>' + h(titulo) + '</label><div class="' + cls + '">' + botoes + '</div>';
}

function linhaGabarito(rotulo, valor, ok){
  let marca = '';
  if (ok === true)  marca = ' <span style="color:var(--ok)">✓</span>';
  if (ok === false) marca = ' <span style="color:var(--err)">✗</span>';
  return '<tr><td>' + h(rotulo) + '</td><td>' + h(valor) + marca + '</td></tr>';
}

function gabaritoHTML(){
  const q = state.q, L = state.last;
  if (!L) return '';

  const bom = L.score >= 60;
  const cor = L.score >= 80 ? 'ok' : (L.score >= 50 ? 'mid' : 'bad');
  const titulo = bom ? '✅ Mandou bem!' : '❌ Revisa isso';

  let linhas = '';

  if (q.tipo === 'infracao'){
    linhas =
      linhaGabarito('Enquadramento', q.enquadramento, L.r.art) +
      linhaGabarito('Gravidade', GRAV_LABEL[q.gravidade], L.r.gravidade) +
      linhaGabarito('Pontos na CNH', q.pontos, L.r.pontos) +
      linhaGabarito('Penalidade', q.penalidade, null) +
      linhaGabarito('Medida administrativa', q.medida, null) +
      linhaGabarito('Retenção do veículo', q.retencao ? 'Sim' : 'Não', L.r.retencao) +
      linhaGabarito('Remoção ao pátio', q.remocao ? 'Sim' : 'Não', L.r.remocao) +
      linhaGabarito('Recolhe documento', q.recolhe_doc ? 'Sim' : 'Não', null);
  } else {
    linhas = linhaGabarito('Resposta correta', q.alternativas[q.correta], L.r.alt);
  }

  return '<div class="gab ' + (bom ? '' : 'bad') + '">' +
    '<div class="score ' + cor + '">' + L.score + '%</div>' +
    '<h3 style="color:' + (bom ? 'var(--ok)' : 'var(--err)') + '">' + titulo + '</h3>' +
    '<table>' + linhas + '</table>' +
    '<p class="fund"><b>Fundamento:</b> ' + h(q.fundamento) + '</p>' +
  '</div>';
}

function render(){
  if (!state.q) filt();
  const q = state.q;
  if (!q) return;

  const total = state.lista.length;
  const pos = state.i + 1;

  document.getElementById('qtd').textContent = Q.length;
  document.getElementById('barra').style.width = Math.round(pos / total * 100) + '%';

  const chips = TEMAS.map(function(t){
    const n = t === 'Todos' ? Q.length : Q.filter(function(x){ return x.tema === t; }).length;
    return '<button class="chip ' + (state.tema === t ? 'on' : '') + '" data-tema="' + h(t) + '">' +
           h(t) + ' <span style="opacity:.6">' + n + '</span></button>';
  }).join('');

  let corpo = '';
  if (q.tipo === 'infracao'){
    corpo =
      grupo('Gravidade', 'gravidade', [
        ['leve','Leve · 3 pts'], ['media','Média · 4 pts'],
        ['grave','Grave · 5 pts'], ['gravissima','Gravíssima · 7 pts']
      ], q.gravidade) +
      grupo('Pontos na CNH', 'pontos', [[3,'3'],[4,'4'],[5,'5'],[7,'7']], q.pontos) +
      grupo('Vai para o pátio? (remoção)', 'remocao', [['sim','Sim'],['nao','Não']], q.remocao ? 'sim' : 'nao') +
      grupo('Há retenção do veículo?', 'retencao', [['sim','Sim'],['nao','Não']], q.retencao ? 'sim' : 'nao') +
      grupo('Enquadramento', 'art',
        artOptions(q).map(function(a){ return [a, a]; }), q.enquadramento, true);
  } else {
    corpo = grupo('Escolha a alternativa', 'alt',
      q.alternativas.map(function(a, i){ return [i, a]; }), q.correta, true);
  }

  const botaoCheck = state.answered ? '' :
    '<button class="btn btn-main" style="margin-top:16px" data-act="check">Ver gabarito</button>';

  document.getElementById('app').innerHTML =
    '<div class="row">' + chips +
      '<button class="btn btn-sec btn-mini" data-act="reset">Zerar placar</button>' +
    '</div>' +

    '<div class="card">' +
      '<div class="meta">' +
        '<span><b>' + h(q.tema) + '</b> · questão ' + pos + '/' + total + '</span>' +
        '<span>✓ ' + state.stats.ok + ' · ✗ ' + state.stats.bad + '</span>' +
      '</div>' +
      '<div class="sit">' + h(q.situacao) + '</div>' +
    '</div>' +

    '<div class="card">' +
      '<h2>Sua decisão</h2>' +
      corpo +
      botaoCheck +
      gabaritoHTML() +
    '</div>';
}

/* ============================================================
   6. EVENTOS
   ============================================================ */
document.addEventListener('click', function(e){
  const chip = e.target.closest('[data-tema]');
  if (chip){ setTema(chip.dataset.tema); return; }

  const opt = e.target.closest('button[data-g]');
  if (opt){ choose(opt.dataset.g, opt.dataset.v); return; }

  const act = e.target.closest('[data-act]');
  if (act && ACTIONS[act.dataset.act]) ACTIONS[act.dataset.act]();
});

document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight') nextQ();
  else if (e.key === 'ArrowLeft') prevQ();
  else if (e.key === 'Enter' && !state.answered) check();
});

/* ============================================================
   7. INÍCIO
   ============================================================ */
filt();
</script>
