<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CTB Quiz · Fiscaliza</title>
<style>
:root{
  --bg:#080d18;--surface:#0f172a;--card:#131c33;--border:#1f2b45;
  --text:#e8eef8;--muted:#7a8aa8;--accent:#22d3ee;--accent2:#06b6d4;
  --green:#10b981;--red:#ef4444;--amber:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  background:var(--bg);color:var(--text);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  font-size:15px;line-height:1.5;
}
body{
  background:radial-gradient(1200px 800px at 50% -10%,rgba(34,211,238,.09),transparent 60%),var(--bg);
  padding-bottom:110px;
}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 0}

/* HEADER */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 0 14px;position:sticky;top:0;z-index:10;
  background:linear-gradient(to bottom,var(--bg) 75%,transparent);
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,#22d3ee,#0891b2);
  display:grid;place-items:center;font-size:19px;
  box-shadow:0 8px 24px rgba(34,211,238,.3);
}
.brand h1{font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.brand p{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
.stats{display:flex;gap:8px}
.stat{
  background:var(--card);border:1px solid var(--border);border-radius:11px;
  padding:7px 11px;text-align:center;min-width:54px;
}
.stat .v{font-size:16px;font-weight:800;line-height:1;color:var(--accent)}
.stat .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;font-weight:700}
.stat.hot .v{color:var(--amber)}
.stat.hot.on .v{animation:pulse .5s ease}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}

/* PROGRESS */
.progress{height:4px;background:var(--card);border-radius:999px;overflow:hidden;margin-bottom:14px}
.progress i{
  display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,#22d3ee,#06b6d4);
  transition:width .35s cubic-bezier(.4,0,.2,1);
}

/* CHIPS */
.chips{
  display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:14px;
  scrollbar-width:none;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;background:var(--card);border:1px solid var(--border);
  color:var(--muted);border-radius:999px;padding:8px 14px;
  font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;
  transition:all .15s;white-space:nowrap;letter-spacing:.1px;
}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent);color:#061a23;border-color:var(--accent);box-shadow:0 4px 16px rgba(34,211,238,.3)}

/* CARD */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:20px;margin-bottom:12px;
}
.tag{
  display:inline-block;font-size:10px;font-weight:800;color:var(--accent);
  letter-spacing:.9px;text-transform:uppercase;padding:5px 11px;
  background:rgba(34,211,238,.1);border-radius:999px;margin-bottom:12px;
}
.question{font-size:16px;font-weight:600;line-height:1.5;letter-spacing:-.1px}

/* OPTIONS */
.options{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.opt{
  width:100%;text-align:left;background:var(--card);border:1.5px solid var(--border);
  color:var(--text);border-radius:14px;padding:15px 16px;
  font-size:14.5px;font-family:inherit;font-weight:500;line-height:1.4;
  cursor:pointer;transition:all .15s ease;display:flex;align-items:center;gap:12px;
}
.opt:active:not(:disabled){transform:scale(.985)}
.opt:not(:disabled):hover{border-color:rgba(34,211,238,.45);background:#16213a}
.opt .marker{
  width:28px;height:28px;flex-shrink:0;border-radius:9px;
  background:var(--surface);border:1.5px solid var(--border);
  display:grid;place-items:center;font-size:13px;font-weight:800;
  color:var(--muted);transition:all .2s;
}
.opt.correct{border-color:var(--green);background:rgba(16,185,129,.1)}
.opt.correct .marker{background:var(--green);border-color:var(--green);color:#041a12}
.opt.wrong{border-color:var(--red);background:rgba(239,68,68,.1)}
.opt.wrong .marker{background:var(--red);border-color:var(--red);color:#1a0404}
.opt.dim{opacity:.32}
.opt:disabled{cursor:default}

/* EXPLAIN */
.explain{
  background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(16,185,129,.03));
  border:1px solid rgba(16,185,129,.3);border-radius:14px;padding:16px;
  margin-bottom:8px;animation:slide .28s ease;
}
.explain.wrong{
  background:linear-gradient(135deg,rgba(239,68,68,.12),rgba(239,68,68,.03));
  border-color:rgba(239,68,68,.3);
}
.explain h4{
  font-size:13px;font-weight:800;letter-spacing:.3px;
  margin-bottom:7px;display:flex;align-items:center;gap:8px;
}
.explain.ok h4{color:var(--green)}
.explain.wrong h4{color:var(--red)}
.explain p{font-size:13.5px;line-height:1.6;color:#c2cee0}
@keyframes slide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ACTIONS */
.actions{
  position:fixed;left:0;right:0;bottom:0;padding:14px 16px 18px;z-index:20;
  max-width:480px;margin:0 auto;
  background:linear-gradient(to top,var(--bg) 60%,transparent);
}
.actions .inner{
  display:flex;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:8px;box-shadow:0 -6px 28px rgba(0,0,0,.45);
}
.btn{
  flex:1;border:0;border-radius:12px;padding:14px;
  font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;
  transition:all .15s;letter-spacing:.2px;
}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:linear-gradient(135deg,#22d3ee,#06b6d4);color:#041a23;
  box-shadow:0 4px 16px rgba(34,211,238,.35);
}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn-ghost{
  background:transparent;color:var(--muted);border:1px solid var(--border);
  flex:0 0 auto;padding:14px 18px;font-size:16px;
}
.btn-ghost:hover{color:var(--text);border-color:rgba(34,211,238,.4)}

/* TOAST */
.toast{
  position:fixed;top:80px;left:50%;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--accent);
  padding:11px 18px;border-radius:11px;font-size:13px;font-weight:700;
  z-index:100;box-shadow:0 12px 40px rgba(0,0,0,.6);
  animation:tin .22s ease;color:var(--accent);
}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

@media (max-width:380px){
  .question{font-size:15px}
  .opt{font-size:13.5px;padding:13px 14px}
  .brand h1{font-size:15px}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="brand">
      <div class="logo">🚦</div>
      <div>
        <h1>CTB Quiz</h1>
        <p>Fiscaliza · DETRAN-SP</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat hot" id="statStreak">
        <div class="v" id="vStreak">0</div>
        <div class="l">🔥 Seq</div>
      </div>
      <div class="stat">
        <div class="v" id="vAcertos">0</div>
        <div class="l">Acertos</div>
      </div>
    </div>
  </div>

  <div class="progress"><i id="progressBar"></i></div>
  <div class="chips" id="chips"></div>
  <div id="quizArea"></div>
</div>

<div class="actions" id="actions">
  <div class="inner">
    <button class="btn btn-ghost" id="btnPrev">←</button>
    <button class="btn btn-primary" id="btnNext" disabled>Escolha uma resposta</button>
  </div>
</div>

/* =========================================================
   ESTADO
   ========================================================= */
const TEMAS = ['Todos','Velocidade','Motocicletas','Veículos','Habilitação','Sinalização','Regras'];
const SKEY = 'ctb_quiz_stats_v1';

const state = {
  tema:'Todos',
  lista:[],
  i:0,
  acertos:0,
  erros:0,
  seq:0,
  melhorSeq:0,
  respondeu:false,
  escolha:null
};

const $ = id => document.getElementById(id);

/* =========================================================
   HELPERS
   ========================================================= */
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1800);
}

/* =========================================================
   JOGO
   ========================================================= */
function buildLista(){
  const base = state.tema === 'Todos' ? Q : Q.filter(q => q[0] === state.tema);
  state.lista = shuffle(base);
  state.i = 0;
  state.respondeu = false;
  state.escolha = null;
}

function setTema(t){
  if(state.tema === t) return;
  state.tema = t;
  buildLista();
  render();
}

function responder(idx){
  if(state.respondeu) return;
  state.escolha = idx;
  state.respondeu = true;

  const q = state.lista[state.i];
  const correta = idx === q[3];

  if(correta){
    state.acertos++;
    state.seq++;
    if(state.seq > state.melhorSeq) state.melhorSeq = state.seq;
  } else {
    state.erros++;
    state.seq = 0;
  }

  render();
}

function proxima(){
  if(!state.lista.length) return;
  if(state.i + 1 >= state.lista.length){
    state.lista = shuffle(state.lista);
    state.i = 0;
    toast('✓ Rodada concluída · Embaralhado de novo!');
  } else {
    state.i++;
  }
  state.respondeu = false;
  state.escolha = null;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function anterior(){
  if(!state.lista.length) return;
  state.i = state.i === 0 ? state.lista.length - 1 : state.i - 1;
  state.respondeu = false;
  state.escolha = null;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  if(!state.lista.length) buildLista();
  const q = state.lista[state.i];
  if(!q) return;

  const [tema, pergunta, opcoes, correta, explicacao] = q;

  // Stats
  const vS = $('vStreak');
  vS.textContent = state.seq;
  $('vAcertos').textContent = state.acertos;
  const streakBox = $('statStreak');
  if(state.seq > 0){
    streakBox.classList.add('on');
    setTimeout(()=>streakBox.classList.remove('on'), 500);
  }

  // Progress
  const pct = ((state.i + 1) / state.lista.length) * 100;
  $('progressBar').style.width = pct + '%';

  // Chips
  $('chips').innerHTML = TEMAS.map(t => {
    const n = t === 'Todos' ? Q.length : Q.filter(x => x[0] === t).length;
    return `<button class="chip${state.tema === t ? ' on' : ''}" data-tema="${t}">${t} · ${n}</button>`;
  }).join('');

  // Opções
  const optsHTML = opcoes.map((op, i) => {
    let cls = 'opt';
    let marca = String.fromCharCode(65 + i);
    if(state.respondeu){
      if(i === correta){ cls += ' correct'; marca = '✓'; }
      else if(i === state.escolha){ cls += ' wrong'; marca = '✗'; }
      else cls += ' dim';
    }
    return `<button class="${cls}" data-idx="${i}" ${state.respondeu ? 'disabled' : ''}>
      <span class="marker">${marca}</span>
      <span>${op}</span>
    </button>`;
  }).join('');

  const acertou = state.respondeu && state.escolha === correta;

  const explainHTML = state.respondeu ? `
    <div class="explain ${acertou ? 'ok' : 'wrong'}">
      <h4>${acertou ? '✓ Correto!' : '✗ Errado'}</h4>
      <p>${explicacao}</p>
    </div>` : '';

  $('quizArea').innerHTML = `
    <div class="card">
      <span class="tag">${tema}</span>
      <div class="question">${pergunta}</div>
    </div>
    <div class="options">${optsHTML}</div>
    ${explainHTML}
  `;

  // Botões
  $('btnPrev').style.display = state.lista.length > 1 ? 'block' : 'none';
  const btnNext = $('btnNext');
  if(!state.respondeu){
    btnNext.disabled = true;
    btnNext.textContent = 'Escolha uma resposta';
  } else {
    btnNext.disabled = false;
    btnNext.textContent = state.i + 1 >= state.lista.length ? 'Recomeçar ↻' : 'Próxima →';
  }
}

/* =========================================================
   EVENTOS
   ========================================================= */
document.addEventListener('click', e => {
  const chip = e.target.closest('[data-tema]');
  if(chip){ setTema(chip.dataset.tema); return; }

  const opt = e.target.closest('[data-idx]');
  if(opt && !state.respondeu){ responder(Number(opt.dataset.idx)); return; }
});

$('btnNext').addEventListener('click', () => {
  if(state.respondeu) proxima();
});

$('btnPrev').addEventListener('click', anterior);

document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight' && state.respondeu) proxima();
  else if(e.key === 'ArrowLeft') anterior();
  else if(!state.respondeu && ['1','2','3','4'].includes(e.key)){
    const idx = Number(e.key) - 1;
    if(idx < state.lista[state.i][2].length) responder(idx);
  }
});

/* =========================================================
   START
   ========================================================= */
buildLista();
render();
</script>
