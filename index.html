<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fiscaliza CTB</title>
<style>
:root{--bg:#0b1220;--card:#152033;--line:#243247;--txt:#eef3fb;--mut:#93a4bd;--ok:#22c55e;--err:#ef4444;--acc:#22d3ee}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.45}
.wrap{max-width:480px;margin:0 auto;padding:12px 12px 100px}
header{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.95);backdrop-filter:blur(8px);padding:12px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
header h1{font-size:1.15rem;color:var(--acc)}
header p{font-size:.78rem;color:var(--mut);margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mut);padding:8px 12px;border-radius:999px;font-size:.78rem;font-weight:600;cursor:pointer}
.chip.on{background:var(--acc);color:#06202a;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:.95rem;margin-bottom:8px;color:var(--acc)}
.meta{font-size:.72rem;color:var(--mut);margin-bottom:8px}
.sit{background:#0f1a2b;border-left:4px solid var(--acc);border-radius:10px;padding:12px;font-size:.92rem}
label{display:block;font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);background:#0b1220;border-radius:10px;padding:12px 10px;font-size:.85rem;cursor:pointer;text-align:center}
.opt.on{border-color:var(--acc);background:#0b2a33;color:var(--acc);font-weight:700}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px}
.btn-main{background:linear-gradient(135deg,#06b6d4,#0ea5e9);color:#041018}
.btn-sec{background:#1b2a40;color:var(--txt);border:1px solid var(--line)}
.foot{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#101a2b;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;z-index:30}
.foot .btn{margin:0}
.gab{margin-top:12px;border-radius:12px;padding:14px;border:1px solid #1f3a2a;background:#0d1f17}
.gab.bad{background:#211014;border-color:#3a1a1f}
.gab h3{margin-bottom:8px}
.gab table{width:100%;font-size:.85rem;border-collapse:collapse}
.gab td{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
.gab td:first-child{color:var(--mut);width:40%}
.score{width:72px;height:72px;border-radius:50%;border:5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;margin:0 auto 10px}
.score.ok{border-color:var(--ok);color:var(--ok)}
.score.mid{border-color:#f59e0b;color:#f59e0b}
.score.bad{border-color:var(--err);color:var(--err)}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#123;border:1px solid var(--acc);color:var(--txt);padding:10px 14px;border-radius:10px;z-index:50;font-size:.85rem}
</style>
</head>

const state={tema:"Todos",lista:[],i:0,q:null,answered:false,stats:JSON.parse(localStorage.getItem("fc_stats")||'{"ok":0,"bad":0}'),sel:{}};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function filt(){state.lista=state.tema==="Todos"?shuffle([...Q]):shuffle(Q.filter(x=>x.tema===state.tema));state.i=0;state.q=state.lista[0];state.answered=false;state.sel={};}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800);}
function opt(g,v,lab){return '<div class="opt'+(state.sel[g]===v?' on':'')+'" onclick="choose(\''+g+'\',\''+String(v).replace(/'/g,"\\'")+'\')">'+lab+'</div>';}
function choose(g,v){if(state.answered)return;state.sel[g]=v;render();}
function setTema(t){state.tema=t;filt();render();}
function nextQ(){state.i=Math.min(state.i+1,state.lista.length-1);state.q=state.lista[state.i];state.answered=false;state.sel={};state.last=null;render();window.scrollTo(0,0);}
function prevQ(){state.i=Math.max(state.i-1,0);state.q=state.lista[state.i];state.answered=false;state.sel={};state.last=null;render();window.scrollTo(0,0);}

function buildArts(q){
const pool=[q.enquadramento,"Art. 218, I, CTB","Art. 218, II, CTB","Art. 218, III, CTB","Art. 244, I, CTB","Art. 230, IX, CTB","Art. 167, CTB","Art. 208, CTB","Art. 162, I, CTB","Art. 165, CTB","Art. 181, XVII, CTB","Art. 173, CTB"];
return shuffle([...new Set(pool)]).slice(0,6);
}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}

function check(){
const q=state.q;
if(!state.sel.gravidade||!state.sel.pontos){toast("Escolhe gravidade e pontos");return;}
state.answered=true;
const okG=state.sel.gravidade===q.gravidade||q.gravidade==="—";
const okP=String(state.sel.pontos)===String(q.pontos)||q.pontos===0;
const okRem=(state.sel.remocao==="sim")===!!q.remocao;
const okRet=(state.sel.retencao==="sim")===!!q.retencao;
const okArt=state.sel.art&&(norm(state.sel.art).includes(norm(q.enquadramento).slice(0,12))||norm(q.enquadramento).includes(norm(state.sel.art).slice(0,10)));
const score=Math.round([okG,okP,okRem,okRet,okArt].filter(Boolean).length/5*100);
if(score>=60)state.stats.ok++;else state.stats.bad++;
localStorage.setItem("fc_stats",JSON.stringify(state.stats));
state.last={okG,okP,okRem,okRet,okArt,score};
render();
}

function render(){
if(!state.q)filt();
const q=state.q;
const chips=TEMAS.map(t=>'<button class="chip '+(state.tema===t?'on':'')+'" onclick="setTema(\''+t+'\')">'+t+'</button>').join("");
document.getElementById("app").innerHTML=
'<div class="row">'+chips+'</div>'+
'<div class="card"><div class="meta">'+q.tema+' · '+(state.i+1)+'/'+state.lista.length+' · acertos '+state.stats.ok+' · erros '+state.stats.bad+'</div>'+
'<div class="sit">'+q.situacao+'</div></div>'+
'<div class="card"><h2>Sua decisao</h2>'+
'<label>Gravidade</label><div class="opts">'+opt("gravidade","leve","Leve (3)")+opt("gravidade","media","Media (4)")+opt("gravidade","grave","Grave (5)")+opt("gravidade","gravissima","Gravissima (7)")+'</div>'+
'<label>Pontos</label><div class="opts">'+opt("pontos","3","3")+opt("pontos","4","4")+opt("pontos","5","5")+opt("pontos","7","7")+'</div>'+
'<label>Vai para o patio? (remocao)</label><div class="opts">'+opt("remocao","sim","Sim")+opt("remocao","nao","Nao")+'</div>'+
'<label>Tem retencao?</label><div class="opts">'+opt("retencao","sim","Sim")+opt("retencao","nao","Nao")+'</div>'+
'<label>Enquadramento</label><div class="opts" style="grid-template-columns:1fr">'+buildArts(q).map(a=>opt("art",a,a)).join("")+'</div>'+
(!state.answered?'<button class="btn btn-main" onclick="check()">Ver gabarito</button>':'')+
'<div id="gab"></div></div>';
if(state.answered)showGab();
let foot=document.querySelector(".foot");
if(!foot){foot=document.createElement("div");foot.className="foot";document.body.appendChild(foot);}
foot.innerHTML='<button class="btn btn-sec" onclick="prevQ()">Anterior</button><button class="btn btn-main" onclick="nextQ()">Proxima</button>';
}

function showGab(){
const q=state.q,L=state.last||{},box=document.getElementById("gab");
if(!box)return;
const good=(L.score||0)>=60;
box.innerHTML='<div class="gab '+(good?'':'bad')+'"><div class="score '+(L.score>=80?'ok':L.score>=50?'mid':'bad')+'">'+(L.score||0)+'%</div>'+
'<h3 style="color:'+(good?'var(--ok)':'var(--err)')+'">'+(good?'Mandou bem':'Revisa isso')+'</h3><table>'+
'<tr><td>Enquadramento</td><td><b>'+q.enquadramento+'</b> '+(L.okArt?'✓':'✗')+'</td></tr>'+
'<tr><td>Gravidade</td><td><b>'+q.gravidade+'</b> '+(L.okG?'✓':'✗')+'</td></tr>'+
'<tr><td>Pontos</td><td><b>'+q.pontos+'</b> '+(L.okP?'✓':'✗')+'</td></tr>'+
'<tr><td>Penalidade</td><td>'+q.penalidade+'</td></tr>'+
'<tr><td>Medida</td><td>'+q.medida+'</td></tr>'+
'<tr><td>Retencao</td><td>'+(q.retencao?'Sim':'Nao')+' '+(L.okRet?'✓':'✗')+'</td></tr>'+
'<tr><td>Remocao (patio)</td><td>'+(q.remocao?'Sim':'Nao')+' '+(L.okRem?'✓':'✗')+'</td></tr>'+
'<tr><td>Recolhe documento</td><td>'+(q.recolhe_doc?'Sim':'Nao')+'</td></tr></table>'+
'<p style="margin-top:10px;font-size:.88rem;color:#b7c7db">'+q.fundamento+'</p></div>';
}

filt();render();
</script>
</body>
</html>
