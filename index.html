<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fiscaliza CTB · Treino de Agente</title>
<style>
:root{
  --bg:#080d18;--surface:#0f172a;--card:#131c33;--card2:#0b1220;--border:#1f2b45;
  --text:#e8eef8;--muted:#7a8aa8;--accent:#22d3ee;--accent2:#06b6d4;
  --green:#10b981;--red:#ef4444;--amber:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  background:var(--bg);color:var(--text);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  font-size:15px;line-height:1.5;
}
body{
  background:radial-gradient(1000px 700px at 50% -10%,rgba(34,211,238,.08),transparent 60%),var(--bg);
  padding-bottom:110px;
}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 0}

/* HEADER */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 0 14px;position:sticky;top:0;z-index:10;
  background:linear-gradient(to bottom,var(--bg) 70%,transparent);
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,#22d3ee,#0891b2);
  display:grid;place-items:center;font-size:19px;
  box-shadow:0 8px 24px rgba(34,211,238,.3);
}
.brand h1{font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.brand p{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
.stats{display:flex;gap:8px}
.stat{
  background:var(--card);border:1px solid var(--border);border-radius:11px;
  padding:7px 11px;text-align:center;min-width:54px;
}
.stat .v{font-size:16px;font-weight:800;line-height:1;color:var(--accent)}
.stat .v.ok{color:var(--green)}
.stat .v.bad{color:var(--red)}
.stat .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;font-weight:700}

/* PROGRESS */
.progress{height:4px;background:var(--card);border-radius:999px;overflow:hidden;margin-bottom:14px}
.progress i{
  display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,#22d3ee,#06b6d4);
  transition:width .35s cubic-bezier(.4,0,.2,1);
}

/* CHIPS */
.chips{
  display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:14px;
  scrollbar-width:none;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;background:var(--card);border:1px solid var(--border);
  color:var(--muted);border-radius:999px;padding:8px 14px;
  font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent);color:#061a23;border-color:var(--accent);box-shadow:0 4px 16px rgba(34,211,238,.3)}

/* CARD */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:18px;margin-bottom:12px;
}
.tag{
  display:inline-block;font-size:10px;font-weight:800;color:var(--accent);
  letter-spacing:.9px;text-transform:uppercase;padding:5px 11px;
  background:rgba(34,211,238,.1);border-radius:999px;margin-bottom:12px;
}
.sit{font-size:15px;font-weight:600;line-height:1.5;color:var(--text)}

/* FIELD LABEL */
.field{margin-bottom:14px}
.field > label{
  display:block;font-size:10.5px;font-weight:800;color:var(--muted);
  text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;
}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.wide{grid-template-columns:1fr}
.opt{
  border:1.5px solid var(--border);background:var(--card2);color:var(--text);
  border-radius:12px;padding:12px 10px;font-size:13.5px;font-family:inherit;
  font-weight:600;cursor:pointer;text-align:center;transition:all .15s;
  line-height:1.35;
}
.opt:active:not(:disabled){transform:scale(.97)}
.opt:not(:disabled):hover{border-color:rgba(34,211,238,.45);background:#16213a}
.opt.on{border-color:var(--accent);background:rgba(34,211,238,.12);color:var(--accent)}
.opt.right{border-color:var(--green);background:rgba(16,185,129,.12);color:var(--green);font-weight:800}
.opt.wrong{border-color:var(--red);background:rgba(239,68,68,.12);color:var(--red);font-weight:800}
.opt.dim{opacity:.4}
.opt:disabled{cursor:default}

/* GABARITO */
.gab{
  margin-top:6px;border-radius:14px;padding:16px;
  border:1px solid rgba(16,185,129,.35);
  background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(16,185,129,.02));
  animation:slide .3s ease;
}
.gab.bad{
  border-color:rgba(239,68,68,.35);
  background:linear-gradient(135deg,rgba(239,68,68,.1),rgba(239,68,68,.02));
}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.score{
  width:76px;height:76px;border-radius:50%;border:5px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:1.25rem;margin:0 auto 12px;
}
.score.ok{border-color:var(--green);color:var(--green)}
.score.mid{border-color:var(--amber);color:var(--amber)}
.score.bad{border-color:var(--red);color:var(--red)}
.gab h3{text-align:center;font-size:15px;margin-bottom:14px;letter-spacing:-.2px}
.gab table{width:100%;font-size:13.5px;border-collapse:collapse}
.gab td{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
.gab td:first-child{color:var(--muted);width:42%;padding-right:8px;font-weight:600}
.gab tr:last-child td{border-bottom:0}
.gab .mark-ok{color:var(--green);font-weight:800}
.gab .mark-bad{color:var(--red);font-weight:800}
.fund{
  margin-top:14px;font-size:13px;line-height:1.55;color:#b7c7db;
  background:rgba(0,0,0,.3);padding:12px;border-radius:10px;
  border-left:3px solid var(--accent);
}
.fund b{color:var(--accent);font-weight:800}

/* ACTIONS */
.actions{
  position:fixed;left:0;right:0;bottom:0;padding:14px 16px 18px;z-index:20;
  max-width:480px;margin:0 auto;
  background:linear-gradient(to top,var(--bg) 60%,transparent);
}
.actions .inner{
  display:flex;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:8px;box-shadow:0 -6px 28px rgba(0,0,0,.5);
}
.btn{
  flex:1;border:0;border-radius:12px;padding:14px;
  font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;
  transition:all .15s;letter-spacing:.2px;
}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:linear-gradient(135deg,#22d3ee,#06b6d4);color:#041a23;
  box-shadow:0 4px 16px rgba(34,211,238,.35);
}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn-ghost{
  background:transparent;color:var(--muted);border:1px solid var(--border);
  flex:0 0 auto;padding:14px 18px;font-size:16px;
}
.btn-ghost:hover{color:var(--text);border-color:rgba(34,211,238,.4)}

/* TOAST */
.toast{
  position:fixed;top:80px;left:50%;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--accent);
  padding:11px 18px;border-radius:11px;font-size:13px;font-weight:700;
  z-index:100;box-shadow:0 12px 40px rgba(0,0,0,.6);
  animation:tin .22s ease;color:var(--accent);text-align:center;max-width:90vw;
}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

@media (max-width:380px){
  .opt{font-size:12.5px;padding:11px 8px}
  .brand h1{font-size:15px}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="brand">
      <div class="logo">🚦</div>
      <div>
        <h1>Fiscaliza CTB</h1>
        <p>Treino · Agente de Trânsito</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="v ok" id="vAc">0</div><div class="l">✓</div></div>
      <div class="stat"><div class="v bad" id="vEr">0</div><div class="l">✗</div></div>
    </div>
  </div>

  <div class="progress"><i id="progressBar"></i></div>
  <div class="chips" id="chips"></div>
  <div id="app"></div>
</div>

<div class="actions">
  <div class="inner">
    <button class="btn btn-ghost" id="btnPrev">←</button>
    <button class="btn btn-primary" id="btnMain">Ver gabarito</button>
  </div>
</div>

<script>
/* =========================================================
   BANCO DE QUESTÕES
   ========================================================= */
const Q = [];

function add(o){ o.id = 'q' + (Q.length + 1); Q.push(o); }

function inf(tema, situacao, irregularidade, enquadramento, gravidade, pontos,
             penalidade, medida, flags, fundamento){
  add({
    tipo:'infracao', tema, situacao, irregularidade, enquadramento,
    gravidade, pontos, penalidade, medida,
    retencao: !!flags[0], remocao: !!flags[1], recolhe_doc: !!flags[2],
    fundamento
  });
}

function teo(tema, situacao, alternativas, correta, fundamento){
  add({ tipo:'teoria', tema, situacao, alternativas, correta, fundamento });
}

/* ---------- VELOCIDADE · Art. 218 ---------- */
const LIM = [
  [30,[34,40,50]], [40,[46,52,62]], [50,[57,65,78]],
  [60,[69,78,93]], [70,[80,91,109]], [80,[92,104,124]],
  [90,[103,117,140]], [100,[115,130,155]], [110,[126,143,170]]
];

LIM.forEach(function(par){
  const lim = par[0];
  par[1].forEach(function(v){
    const pct = (v - lim) / lim * 100;
    let art, g, p, pen, med;
    if (pct <= 20){
      art='I'; g='media'; p=4; pen='Multa';
      med='Nenhuma';
    } else if (pct <= 50){
      art='II'; g='grave'; p=5; pen='Multa';
      med='Nenhuma';
    } else {
      art='III'; g='gravissima'; p=7;
      pen='Multa (3x) e suspensão do direito de dirigir';
      med='Suspensão do direito de dirigir (processo)';
    }
    add({
      tipo:'infracao', tema:'Velocidade',
      situacao:'Radar registrou ' + v + ' km/h em via cujo limite é ' + lim + ' km/h.',
      irregularidade:'Excesso de velocidade',
      enquadramento:'Art. 218, ' + art + ', CTB',
      gravidade:g, pontos:p, penalidade:pen, medida:med,
      retencao:false, remocao:false, recolhe_doc:false,
      fundamento:'Art. 218 do CTB: até 20% → inciso I (média); mais de 20% até 50% → inciso II (grave); ' +
        'acima de 50% → inciso III (gravíssima, multa 3x + suspensão). ' +
        'Excesso de ' + pct.toFixed(1) + '% (limite ' + lim + ' km/h).'
    });
  });
});

/* ---------- MOTOCICLETAS ---------- */
const TM='Motocicletas';
inf(TM,'Condutor de motocicleta circulando sem capacete.','Sem capacete','Art. 244, I, CTB',
  'gravissima',7,'Multa e suspensão do direito de dirigir','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'Art. 244, I. Gravíssima, com suspensão e recolhimento do documento de habilitação.');
inf(TM,'Passageiro de motocicleta sem capacete.','Passageiro sem capacete','Art. 244, I, CTB',
  'gravissima',7,'Multa e suspensão do direito de dirigir','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'O Art. 244, I também alcança o passageiro sem capacete.');
inf(TM,'Motocicleta com descarga livre (escapamento alterado).','Descarga livre','Art. 230, XI, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 230, XI. Retenção até regularizar — não há remoção automática.');
inf(TM,'Motocicleta transportando criança de 7 anos.','Criança na moto','Art. 244, V, CTB',
  'gravissima',7,'Multa e suspensão do direito de dirigir','Retenção do veículo',
  [1,0,0],'Art. 244, V — transportar criança menor de 10 anos em motocicleta.');
inf(TM,'Condutor com capacete sem viseira nem óculos de proteção.','Capacete irregular','Art. 244, I, CTB',
  'gravissima',7,'Multa e suspensão do direito de dirigir','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'Art. 244, I c/c resoluções do CONTRAN sobre equipamentos de segurança.');
inf(TM,'Motocicleta transitando de dia com o farol apagado.','Farol apagado','Art. 244 / Art. 40, CTB',
  'media',4,'Multa','Nenhuma',[0,0,0],'Uso obrigatório do farol baixo aceso durante o dia para motocicletas.');
inf(TM,'Passageiro transportado fora do assento traseiro.','Passageiro irregular','Art. 244, II, CTB',
  'gravissima',7,'Multa e suspensão do direito de dirigir','Retenção do veículo',
  [1,0,0],'Art. 244, II — passageiro em desacordo com as normas.');
inf(TM,'Placa da motocicleta ilegível.','Placa ilegível','Art. 230, I, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 230, I — identificação externa em desacordo com as normas.');
inf(TM,'Motocicleta com pneu traseiro careca.','Pneu careca','Art. 230, XVIII, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 230, XVIII — mau estado de conservação comprometendo a segurança.');
inf(TM,'Motocicleta sem espelho retrovisor.','Sem espelho','Art. 230, IX, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 230, IX — equipamento obrigatório inoperante ou ineficiente.');

/* ---------- VEÍCULOS ---------- */
const TV='Veículos';
inf(TV,'Condutor de automóvel sem cinto de segurança.','Sem cinto','Art. 167, CTB',
  'grave',5,'Multa','Retenção do veículo até a colocação do cinto',
  [1,0,0],'Art. 167. A retenção cessa quando o cinto é colocado — a multa permanece.');
inf(TV,'Passageiro do banco dianteiro sem cinto.','Passageiro sem cinto','Art. 167, CTB',
  'grave',5,'Multa','Retenção do veículo até a colocação do cinto',
  [1,0,0],'Art. 167 aplica-se ao condutor e aos passageiros.');
inf(TV,'Criança de 5 anos no banco dianteiro sem cadeirinha.','Criança sem dispositivo','Art. 168 + Res. 819/2021',
  'gravissima',7,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 168 do CTB + Resolução CONTRAN 819/2021 (transporte de crianças).');
inf(TV,'Criança de 8 anos, 1,30 m, no banco dianteiro só com cinto de 3 pontos.','Altura inferior a 1,45 m','Art. 168 + Res. 819/2021',
  'gravissima',7,'Multa','Retenção do veículo até regularização',
  [1,0,0],'A regra combina idade E altura: menores de 10 anos que não atingiram 1,45 m exigem dispositivo de retenção.');
inf(TV,'Farol dianteiro esquerdo queimado.','Equipamento inoperante','Art. 230, IX, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 230, IX. Regularizado no local, o veículo é liberado — a multa permanece.');
inf(TV,'Película muito escura nos vidros laterais dianteiros.','Película irregular','Art. 230 + Res. CONTRAN',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Transmissão luminosa fora dos limites estabelecidos pelo CONTRAN.');
inf(TV,'Veículo estacionado sobre a calçada.','Estacionado na calçada','Art. 181, VIII, CTB',
  'media',4,'Multa','Remoção do veículo ao pátio',
  [0,1,0],'Art. 181, VIII — estacionar sobre a calçada gera multa E remoção.');
inf(TV,'Veículo estacionado em local com placa de proibição.','Local proibido','Art. 181, XVII, CTB',
  'media',4,'Multa','Remoção do veículo ao pátio',
  [0,1,0],'Art. 181, XVII — estacionar em desacordo com a sinalização gera multa E remoção.');
inf(TV,'Veículo em vaga de PCD sem credencial.','Vaga PCD sem credencial','Art. 181, XX, CTB',
  'gravissima',7,'Multa','Remoção do veículo ao pátio',
  [0,1,0],'Art. 181, XX — vaga reservada a pessoa com deficiência sem credencial.');
inf(TV,'Veículo em vaga de idoso sem credencial.','Vaga de idoso sem credencial','Art. 181, XX, CTB',
  'gravissima',7,'Multa','Remoção do veículo ao pátio',
  [0,1,0],'Art. 181, XX — vaga reservada a idoso sem credencial.');
inf(TV,'Para-brisa com trinca que compromete a visão do condutor.','Mau estado de conservação','Art. 230, XVIII, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 230, XVIII — mau estado de conservação comprometendo a segurança.');
inf(TV,'Pneus lisos (carecas) nos dois eixos.','Pneus carecas','Art. 230, XVIII, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 230, XVIII.');
inf(TV,'Veículo com chassi adulterado.','Chassi adulterado','Art. 230, V, CTB',
  'gravissima',7,'Multa e apreensão do veículo','Remoção do veículo e retenção dos documentos',
  [0,1,1],'Art. 230, V — identificação adulterada. Pode configurar crime (CP, art. 311).');
inf(TV,'Placa com caracteres adulterados.','Placa adulterada','Art. 230, I e V, CTB',
  'gravissima',7,'Multa e apreensão do veículo','Remoção do veículo e retenção dos documentos',
  [0,1,1],'Art. 230 — adulteração de identificação veicular.');
inf(TV,'Caminhão com excesso de peso no eixo traseiro.','Excesso de peso','Art. 231, V, CTB',
  'media',4,'Multa','Retenção do veículo e transbordo da carga',
  [1,0,0],'Art. 231, V c/c Art. 269, VIII (transbordo da carga).');
inf(TV,'Dois veículos disputando corrida em avenida movimentada.','Racha','Art. 173, CTB',
  'gravissima',7,'Multa (10x), suspensão e apreensão do veículo','Remoção do veículo e recolhimento da CNH',
  [0,1,1],'Art. 173 — multa 10x. Também configura crime de trânsito (art. 308).');
inf(TV,'Competição automobilística em via pública sem autorização.','Competição não autorizada','Art. 174, CTB',
  'gravissima',7,'Multa (10x) e suspensão do direito de dirigir','Remoção do veículo',
  [0,1,1],'Art. 174 — promoção de competição não autorizada em via pública.');
inf(TV,'Condutor usando telefone celular na mão enquanto dirige.','Celular ao volante','Art. 252, VI, CTB',
  'media',4,'Multa','Nenhuma',[0,0,0],'Art. 252, VI — dirigir segurando ou manuseando telefone celular.');
inf(TV,'Som automotivo em volume excessivo incomodando vizinhos.','Som excessivo','Art. 228, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 228 — perturbação do sossego com som acima dos limites.');
inf(TV,'Carga solta na carroceria, sem amarração.','Carga mal acondicionada','Art. 235, CTB',
  'grave',5,'Multa','Retenção do veículo até regularização',
  [1,0,0],'Art. 235 — carga mal acondicionada ou sem amarração.');

/* ---------- HABILITAÇÃO ---------- */
const TH='Habilitação';
inf(TH,'Condutor sem CNH e sem PPD dirigindo automóvel.','Sem habilitação','Art. 162, I, CTB',
  'gravissima',7,'Multa (3x) e apreensão do veículo','Retenção do veículo até apresentação de condutor habilitado',
  [1,0,0],'Art. 162, I — multa multiplicada por 3.');
inf(TH,'Condutor com CNH categoria B dirigindo ônibus (categoria D).','Categoria diversa','Art. 162, III, CTB',
  'gravissima',7,'Multa e apreensão do veículo','Retenção do veículo até apresentação de condutor habilitado',
  [1,0,0],'Art. 162, III — dirigir com categoria diferente da exigida.');
inf(TH,'Condutor com CNH cassada dirigindo.','CNH cassada','Art. 162, II, CTB',
  'gravissima',7,'Multa (3x) e apreensão do veículo','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'Art. 162, II — dirigir com CNH cassada.');
inf(TH,'Condutor com CNH suspensa dirigindo.','CNH suspensa','Art. 162, II + Art. 263, I, CTB',
  'gravissima',7,'Multa (3x) e apreensão do veículo','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'Art. 162, II + Art. 263, I — dirigir suspenso gera processo de cassação.');
inf(TH,'Bafômetro registra 0,15 mg/L.','Sob influência de álcool','Art. 165, CTB',
  'gravissima',7,'Multa (10x) e suspensão por 12 meses','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'Art. 165 — tolerância zero para álcool. Multa multiplicada por 10.');
inf(TH,'Bafômetro registra 0,28 mg/L, sem sinais aparentes de embriaguez.','Infração administrativa','Art. 165, CTB',
  'gravissima',7,'Multa (10x) e suspensão por 12 meses','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'Crime de trânsito (art. 306) só a partir de 0,3 mg/L ou com sinais de alteração psicomotora.');
inf(TH,'Bafômetro registra 0,35 mg/L.','Álcool + crime de trânsito','Art. 165 + Art. 306, CTB',
  'gravissima',7,'Multa (10x), suspensão 12 meses + responsabilidade penal','Retenção do veículo e recolhimento da CNH',
  [1,0,1],'Art. 165 (administrativo) + Art. 306 (crime de trânsito).');
inf(TH,'Condutor se recusa a soprar o bafômetro.','Recusa ao teste','Art. 165-A, CTB',

/* =========================================================
   ESTADO
   ========================================================= */
const TEMAS = ['Todos','Velocidade','Motocicletas','Veículos','Habilitação','Sinalização','Regras'];
const GRAV_LABEL = { leve:'Leve', media:'Média', grave:'Grave', gravissima:'Gravíssima' };

const state = {
  tema:'Todos',
  lista:[],
  i:0,
  answered:false,
  sel:{},
  last:null,
  stats: JSON.parse(localStorage.getItem('fc_stats_v3') || '{"ok":0,"bad":0}')
};

function saveStats(){
  try { localStorage.setItem('fc_stats_v3', JSON.stringify(state.stats)); } catch(e){}
}

/* =========================================================
   HELPERS
   ========================================================= */
function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function h(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 1900);
}

/* =========================================================
   ENQUADRAMENTO — EXATAMENTE 4 OPÇÕES
   ========================================================= */
function artOptions(q){
  const correct = q.enquadramento;

  // Velocidade: sempre as 3 alíneas do Art. 218 + Art. 219 como 4ª
  if (correct.indexOf('Art. 218') === 0){
    return shuffle([
      'Art. 218, I, CTB',
      'Art. 218, II, CTB',
      'Art. 218, III, CTB',
      'Art. 219, CTB'
    ]);
  }

  // Demais: 3 distratores preferindo o mesmo tema
  const sameTema = shuffle(Array.from(new Set(
    Q.filter(function(x){ return x.tipo === 'infracao' && x.tema === q.tema && x.enquadramento !== correct; })
      .map(function(x){ return x.enquadramento; })
  )));

  const outros = shuffle(Array.from(new Set(
    Q.filter(function(x){ return x.tipo === 'infracao' && x.tema !== q.tema && x.enquadramento !== correct; })
      .map(function(x){ return x.enquadramento; })
  )));

  const pool = sameTema.concat(outros);
  const distractors = pool.slice(0, 3);

  return shuffle([correct].concat(distractors));
}

/* =========================================================
   FLUXO
   ========================================================= */
function buildLista(){
  const base = state.tema === 'Todos' ? Q : Q.filter(function(x){ return x.tema === state.tema; });
  state.lista = shuffle(base);
  state.i = 0;
  state.answered = false;
  state.sel = {};
  state.last = null;
}

function setTema(t){
  if (state.tema === t) return;
  state.tema = t;
  buildLista();
  render();
}

function choose(campo, valor){
  if (state.answered) return;
  state.sel[campo] = valor;
  render();
}

function check(){
  const q = state.q || state.lista[state.i];

  if (q.tipo === 'infracao'){
    const obrig = ['gravidade','pontos','retencao','remocao','art'];
    const falta = obrig.filter(function(k){ return state.sel[k] === undefined; });
    if (falta.length){ toast('Responda todos os campos antes de ver o gabarito.'); return; }

    const r = {
      gravidade: state.sel.gravidade === q.gravidade,
      pontos:    Number(state.sel.pontos) === q.pontos,
      retencao:  (state.sel.retencao === 'sim') === q.retencao,
      remocao:   (state.sel.remocao === 'sim') === q.remocao,
      art:       state.sel.art === q.enquadramento
    };
    const acertos = Object.keys(r).filter(function(k){ return r[k]; }).length;
    state.last = { r:r, score: Math.round(acertos / 5 * 100) };
  } else {
    if (state.sel.alt === undefined){ toast('Escolha uma alternativa.'); return; }
    const ok = Number(state.sel.alt) === q.correta;
    state.last = { r:{ alt:ok }, score: ok ? 100 : 0 };
  }

  state.answered = true;
  if (state.last.score >= 60) state.stats.ok++; else state.stats.bad++;
  saveStats();
  render();
}

function nextQ(){
  if (!state.lista.length) return;
  if (state.i + 1 >= state.lista.length){
    state.lista = shuffle(state.lista);
    state.i = 0;
    toast('✓ Rodada concluída · Embaralhado de novo!');
  } else {
    state.i++;
  }
  state.answered = false;
  state.sel = {};
  state.last = null;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function prevQ(){
  if (!state.lista.length) return;
  state.i = state.i === 0 ? state.lista.length - 1 : state.i - 1;
  state.answered = false;
  state.sel = {};
  state.last = null;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* =========================================================
   RENDER
   ========================================================= */
function grupo(titulo, campo, opcoes, correto, wide){
  const cls = wide ? 'opts wide' : 'opts';
  const botoes = opcoes.map(function(o){
    const valor = String(o[0]);
    const label = o[1];
    const selecionado = state.sel[campo] === valor;
    let c = 'opt';

    if (state.answered){
      if (valor === String(correto)) c += ' right';
      else if (selecionado)          c += ' wrong';
      else                           c += ' dim';
    } else if (selecionado){
      c += ' on';
    }

    return '<button class="' + c + '" data-g="' + h(campo) + '" data-v="' + h(valor) + '"' +
           (state.answered ? ' disabled' : '') + '>' + h(label) + '</button>';
  }).join('');

  return '<div class="field"><label>' + h(titulo) + '</label>' +
         '<div class="' + cls + '">' + botoes + '</div></div>';
}

function linhaGabarito(rotulo, valor, ok){
  let marca = '';
  if (ok === true)  marca = ' <span class="mark-ok">✓</span>';
  if (ok === false) marca = ' <span class="mark-bad">✗</span>';
  return '<tr><td>' + h(rotulo) + '</td><td>' + h(valor) + marca + '</td></tr>';
}

function gabaritoHTML(){
  const q = state.q || state.lista[state.i];
  const L = state.last;
  if (!L) return '';

  const bom = L.score >= 60;
  const cor = L.score >= 80 ? 'ok' : (L.score >= 50 ? 'mid' : 'bad');
  const titulo = bom ? '✓ Mandou bem!' : '✗ Revisa isso';

  let linhas = '';
  if (q.tipo === 'infracao'){
    linhas =
      linhaGabarito('Enquadramento', q.enquadramento, L.r.art) +
      linhaGabarito('Gravidade', GRAV_LABEL[q.gravidade], L.r.gravidade) +
      linhaGabarito('Pontos na CNH', q.pontos, L.r.pontos) +
      linhaGabarito('Penalidade', q.penalidade, null) +
      linhaGabarito('Medida administrativa', q.medida, null) +
      linhaGabarito('Retenção do veículo', q.retencao ? 'Sim' : 'Não', L.r.retencao) +
      linhaGabarito('Remoção ao pátio', q.remocao ? 'Sim' : 'Não', L.r.remocao) +
      linhaGabarito('Recolhe documento', q.recolhe_doc ? 'Sim' : 'Não', null);
  } else {
    linhas = linhaGabarito('Resposta correta', q.alternativas[q.correta], L.r.alt);
  }

  return '<div class="gab ' + (bom ? '' : 'bad') + '">' +
    '<div class="score ' + cor + '">' + L.score + '%</div>' +
    '<h3 style="color:' + (bom ? 'var(--green)' : 'var(--red)') + '">' + titulo + '</h3>' +
    '<table>' + linhas + '</table>' +
    '<p class="fund"><b>Fundamento:</b> ' + h(q.fundamento) + '</p>' +
  '</div>';
}

function render(){
  if (!state.lista.length) buildLista();
  const q = state.lista[state.i];
  if (!q) return;
  state.q = q;

  // Stats
  document.getElementById('vAc').textContent = state.stats.ok;
  document.getElementById('vEr').textContent = state.stats.bad;

  // Progress
  const pct = ((state.i + 1) / state.lista.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';

  // Chips
  document.getElementById('chips').innerHTML = TEMAS.map(function(t){
    const n = t === 'Todos' ? Q.length : Q.filter(function(x){ return x.tema === t; }).length;
    return '<button class="chip' + (state.tema === t ? ' on' : '') + '" data-tema="' + h(t) + '">' +
           h(t) + ' · ' + n + '</button>';
  }).join('');

  // Corpo
  let corpo = '';
  if (q.tipo === 'infracao'){
    corpo =
      grupo('Gravidade', 'gravidade', [
        ['leve', 'Leve'],
        ['media', 'Média'],
        ['grave', 'Grave'],
        ['gravissima', 'Gravíssima']
      ], q.gravidade) +

      grupo('Pontos na CNH', 'pontos', [
        [3, '3'], [4, '4'], [5, '5'], [7, '7']
      ], q.pontos) +

      grupo('Vai para o pátio? (remoção)', 'remocao',
        [['sim','Sim'], ['nao','Não']], q.remocao ? 'sim' : 'nao') +

      grupo('Há retenção do veículo?', 'retencao',
        [['sim','Sim'], ['nao','Não']], q.retencao ? 'sim' : 'nao') +

      grupo('Enquadramento', 'art',
        artOptions(q).map(function(a){ return [a, a]; }), q.enquadramento, true);
  } else {
    corpo = grupo('Escolha a alternativa', 'alt',
      q.alternativas.map(function(a, i){ return [i, a]; }), q.correta, true);
  }

  document.getElementById('app').innerHTML =
    '<div class="card">' +
      '<span class="tag">' + h(q.tema) + '</span>' +
      '<div class="sit">' + h(q.situacao) + '</div>' +
    '</div>' +
    '<div class="card">' +
      corpo +
      (state.answered ? '' : '') +
      gabaritoHTML() +
    '</div>';

  // Botões
  document.getElementById('btnPrev').style.display = state.lista.length > 1 ? 'block' : 'none';
  const btnMain = document.getElementById('btnMain');
  if (state.answered){
    btnMain.disabled = false;
    btnMain.textContent = (state.i + 1 >= state.lista.length) ? 'Recomeçar ↻' : 'Próxima →';
  } else {
    btnMain.disabled = false;
    btnMain.textContent = 'Ver gabarito';
  }
}

/* =========================================================
   EVENTOS
   ========================================================= */
document.addEventListener('click', function(e){
  const chip = e.target.closest('[data-tema]');
  if (chip){ setTema(chip.dataset.tema); return; }

  const opt = e.target.closest('button[data-g]');
  if (opt && !state.answered){ choose(opt.dataset.g, opt.dataset.v); return; }
});

document.getElementById('btnMain').addEventListener('click', function(){
  if (state.answered) nextQ();
  else check();
});

document.getElementById('btnPrev').addEventListener('click', prevQ);

document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight' && state.answered) nextQ();
  else if (e.key === 'ArrowLeft') prevQ();
  else if (e.key === 'Enter'){
    if (state.answered) nextQ();
    else check();
  }
});

/* =========================================================
   START
   ========================================================= */
buildLista();
render();
</script>
